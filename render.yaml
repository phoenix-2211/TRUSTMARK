services:
  - type: web
    name: trustmark-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_LLM
        value: "true"
      - key: RAZORPAY_WEBHOOK_SECRET
        value: test_webhook_secret
